e encaminhamento à produção.')+`<form class="card" onsubmit="makePost(event)"><div class="grid">${field('date','Data','')}${field('channel','Canal','Instagram')}${field('format','Formato','Carrossel')}${field('title','Tema / headline')}</div>${text('caption','Legenda / briefing')}<button class="primary">Adicionar publicação</button> <button type="button" onclick="calendarPrompt()">Preparar calendário com IA</button></form><div class="card" style="margin-top:16px"><table><tr><th>Data</th><th>Canal</th><th>Tema</th><th>Ação</th></tr>${c.posts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.channel)} · ${esc(p.format)}</td><td>${esc(p.title)}</td><td><button onclick="postTask('${p.id}')">Criar tarefa</button></td></tr>`).join('')}</table></div>`}else if(page===menu[4]){h=head('Creative studio','Direção de arte baseada no contexto do cliente.')+`<form class="card" onsubmit="makeCreative(event)">${field('format','Formato','Feed 1080 × 1350')}${field('headline','Headline')}${text('concept','Conceito, referências e finalidade')}${text('assets','Links de logos e imagens de referência')}<button class="primary">Preparar prompt criativo</button></form><p class="notice">O beta gera o briefing textual. A geração de imagens e leitura dos arquivos de referência exigem integração real.</p>${history(c.creative,'Briefings criativos')}`}else if(page===menu[5]){h=head('Gestão de tarefas','Kanban por etapa, com responsáveis e prazos.')+`<form class="card" onsubmit="makeTask(event)"><div class="grid">${field('title','Tarefa')}<div><label>Área</label><select name="area">${opts(areas)}</select></div>${field('owner','Responsável')}${field('date','Prazo')}</div><button class="primary">Adicionar tarefa</button></form><div class="board" style="margin-top:20px">${stages.map(s=>`<div class="lane"><b>${s}</b>${c.tasks.filter(t=>t.stage===s).map(t=>`<div class="task"><b>${esc(t.title)}</b><p class="muted">${esc(t.area)} · ${esc(t.owner||'Sem respons function history(a,title){return `<h2 style="margin-top:24px">${title}</h2>${a.map((x,i)=>`<div class="card" style="margin:10px 0"><div class="row"><b>${esc(x.title)}</b><button onclick="copyEntry('${x.id}')">Copiar prompt</button></div><details><summary>Ver conteúdo</summary><pre>${esc(x.body)}</pre></details></div>`).join('')||'<p class="muted">Nenhum registro ainda.</p>'}`}function context(){let c=C();return `Cliente: ${c.name}\nSegmento: ${c.segment}\nObjetivo: ${c.goal}\nTom: ${c.tone||'não definido'}\nCores: ${c.colors||'não definidas'}\nBriefing: ${c.brief||'não informado'}\nDrive: ${c.drive||'não vinculado'}\nNão invente dados nem alegue acesso aos arquivos sem leitura efetiva.\n`}function makePlan(e){e.preventDefault();let d=data(e.target);C().plans.unshift({id:uid(),title:d.period,body:context()+`Crie planejamento estratégico para ${d.period}. Objetivo: ${d.objective}. Restrições: ${d.constraints}. Entregue diagnóstico, público, posicionamento, oferta, canais, funil, orçamento se informado, KPIs, calendário semanal, responsáveis por área e hipóteses a validar.`});save();render()}function makeCreative(e){e.preventDefault();let d=data(e.target);C().creative.unshift({id:uid(),title:d.headline||d.format,body:context()+`Crie direção de arte para ${d.format}. Headline: ${d.headline}. Conceito: ${d.concept}. Assets: ${d.assets}. Preserve o logo original, respeite a identidade, hierarquia e respiro. Entregue proposta visual e prompt de geração; solicite arquivos ausentes.`});save();render()}function copyEntry(id){let x=[...C().plans,...C().creative].find(x=>x.id===id);if(x)copy(x.body)}function calendarPrompt(){copy(context()+'Crie calendário editorial mensal com data, canal, formato, tema, headline, legenda, CTA, objetivo e área responsável. Separe fatos de hipóteses.')}function makePost(e){e.preventDefault();let d=data(e.target);if(!d.title.trim())return alert('Informe o tema.');C().posts.push({...d,id:uid()});save();render()}function postTask(id){let p=C().post const catalog={ 'CPL':['Meta Ads','R$',-1], 'Alcance':['Meta Ads','',1], 'Impressões':['Meta Ads','',1], 'Engajamento':['Meta Ads','',1], 'Leads':['CRM','',1], 'Vendas':['CRM','',1], 'Receita':['CRM','R$',1], 'Conversão':['CRM','%',1], 'CPC':['Google Ads','R$',-1], 'Conversões Google':['Google Ads','',1], 'CPA':['Google Ads','R$',-1], 'ROAS':['Meta Ads','x',1], 'Investimento':['Meta Ads','R$',0] };

function change(v){return v&&v.previous>0?(v.current-v.previous)/v.previous*100:null}
function fmt(n,k){if(n==null)return '—';let u=catalog[k][1];return (u==='R$'?'R$ ':'')+Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2})+(['%','x'].includes(u)?u:'')}
function evaluate(c){init(c);for(let k of c.kpis){let v=c.values[k],d=change(v),dir=catalog[k]?.[2];if(d===null||!dir||Math.abs(d)<c.threshold)continue;let positive=d*dir>0;let key=[k,v.previous,v.current,v.period||'',c.threshold].join('|');if(!c.alerts.some(a=>a.key===key))c.alerts.unshift({id:uid(),key,k,positive,detail:`${k}: ${d>0?'+':''}${d.toFixed(1)}% (${fmt(v.previous,k)} → ${fmt(v.current,k)})`,owner:c.account||'Sem responsável',status:'Pendente',note:'',date:new Date().toLocaleDateString('pt-BR')})}}
function openAlerts(c){return init(c).alerts.filter(a=>a.status!=='Resolvido')}
function status(c){let a=openAlerts(c);return `<span class="status ${c.ops==='Regular'?'neutral':'warn'}">${esc(c.ops)}</span>${a.some(x=>!x.positive)?'<span class="status bad">↓ Piora</span>':''}${a.some(x=>x.positive)?'<span class="status good">↑ Melhora</span>':''}`}
function portfolio(){let cs=db.clients.map(init);return head('Clientes','Carteira da agência · gestão de contas, equipes e sinais de performance.')+`<div class="cards">${[['Clientes',cs.length],['Contas com risco',cs.filter(c=>c.ops!=='Regular'||openAlerts(c).some(a=>!a.positive)).length],['Contas com melhora',cs.filter(c=>openAlerts(c).some(a=>a.positive)).length],['Alertas pendentes',cs.reduce((n,c)=>n+openAlerts(c).length,0)]].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="metric">${v}</div></div>`).join('')}</div><div class="card"><div class="row"><h2>Carteira de clientes</h2><input class="search" type="search" aria-label="Buscar clientes na carteira" placeholder="Buscar cliente, equipe ou status…" oninput="filterRows(this.value)"></div><div class="portfolio-table"><table><thead><tr><th>Cliente</th><th>Responsável</th><th>Designer</th><th>Tráfego</th><th>Social Media</th><th>Status e alertas</th><th></th></tr></thead><tbody id="clientRows">${cs.map(c=>`<tr><td><div class="clientname">${esc(c.name)}</div><span class="muted small">${esc(c.segment)}</span></td><td>${esc(c.account||'—')}</td><td>${esc(c.designer||'—')}</td><td>${esc(c.traffic||'—')}</td><td>${esc(c.social||'—')}</td><td>${status(c)}<div class="small muted">${openAlerts(c).length} alertas abertos</div></td><td><button class="primary mini" onclick="switchClient('${c.id}')">Abrir conta →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function filterRows(q){document.querySelectorAll('#clientRows tr').forEach(r=>r.hidden=!norm(r.textContent).includes(norm(q)))}function quickFind(q){let el=document.getElementById('quickResults');if(!norm(q)){el.innerHTML='';return}let results=db.clients.filter(c=>norm([c.name,c.segment,c.account,c.designer,c.traffic,c.social].join(' ')).includes(norm(q)));el.innerHTML=results.map(c=>`<button class="mini" onclick="document.getElementById('quickSearch').value='';quickFind('');switchClient('${c.id}')">${esc(c.name)}<br><span class="small muted">${esc(c.account||'Sem responsável')}</span></button>`).join('')||'<p class="small">Nenhum cliente encontrado.</p>'}
function overview(c){init(c);return `<div class="row"><div><button class="mini" onclick="go('Carteira de clientes')">← Todos os clientes</button><h1 style="margin:14px 0 5px">${esc(c.name)}</h1><p class="muted">${esc(c.segment)} · ${esc(c.goal)}</p></div><div>${status(c)}</div></div><div class="card"><div class="row"><div><div class="tag">Equipe da conta</div><div class="actions" style="margin-top:12px">${roles.map(([k,l])=>`<div style="min-width:130px"><div class="small muted">${l}</div><b>${esc(c[k]||'Não atribuído')}</b></div>`).join('')}</div></div><button onclick="go('Clientes & marca')">Editar conta</button></div></div><div class="section"><div class="row"><h2>Visão de performance</h2><button onclick="document.getElementById('kpiDialog').showModal()">⚙ Personalizar indicadores</button></div><p class="muted small">Dados de demonstração ou entrada manual · comparação entre períodos equivalentes.</p><div class="cards">${c.kpis.map(k=>{let v=c.values[k],d=change(v),direction=catalog[k][2];return `<div class="card kpi"><div class="tag">${catalog[k][0]} · ${k}</div><div class="metric" style="margin:12px 0">${fmt(v?.current,k)}</div><span class="status ${d===null||!direction?'neutral':d*direction>0?'good':d*direction<0?'bad':'neutral'}">${d===null?'Sem comparação':(d>0?'+':'')+d.toFixed(1)+'%'}</span><div class="muted small">Anterior: ${fmt(v?.previous,k)} · ${esc(v?.period||'Demo/manual')}</div></div>`}).join('')||'<p>Selecione os indicadores.</p>'}</div><button onclick="document.getElementById('valuesDialog').showModal()">Atualizar números / simular alertas</button></div><div class="grid section"><div class="card"><h2>Produção e inteligência</h2><p class="muted">Ações contextualizadas para esta conta.</p><div class="actions"><button class="primary" onclick="go('Planejamento')">Gerar planejamento</button><button onclick="go('Social calendar')">Calendário social</button><button onclick="go('Creative studio')">Criar artes</button><button class="primary" onclick="go('Relatórios')">Gerar relatórios →</button><button onclick="go('Tarefas')">Tarefas da conta (${c.tasks.length})</button></div></div><div class="card"><h2>Base de conhecimento</h2><p>${c.drive?'Link do Drive cadastrado':'Google Drive não vinculado'}</p><div class="actions"><button onclick="go('Clientes & marca')">Vincular / editar Drive</button><button onclick="openDrive()">Abrir pasta</button><button onclick="go('Integrações')">Integrações</button></div><p class="muted small">Vínculo por URL; leitura automática ainda não conectada.</p></div></div><div class="grid section"><div class="card"><h2>Saúde da conta</h2><form onsubmit="event.preventDefault();Object.assign(C(),data(this));save();render()"><label>Status operacional</label><select name="ops">${['Regular','Atraso','Reclamação','Risco de cancelamento','Aguardando cliente'].map(x=>`<option ${c.ops===x?'selected':''}>${x}</option>`).join('')}</select>${text('opsNote','Ocorrência / observações',c.opsNote)}<button class="primary">Atualizar status</button></form></div><div class="card"><h2>Alertas e tratativas</h2>${openAlerts(c).map(a=>alertRow(c,a)).join('')||'<p class="muted">Nenhum alerta aberto.</p>'}<button onclick="go('Central de alertas')">Ver alertas da carteira</button></div></div><dialog id="kpiDialog"><form onsubmit="saveKpis(event)"><h2>Indicadores da conta</h2>${Object.keys(catalog).map(k=>`<label style="display:flex;align-items:center;gap:8px"><input style="width:auto" type="checkbox" name="kpi" value="${k}" ${c.kpis.includes(k)?'checked':''}>${k} · ${catalog[k][0]}</label>`).join('')}<label>Limiar de alerta (%)</label><input type="number" name="threshold" min="1" max="1000" required value="${c.threshold}"><p class="muted small">Custos menores são positivos; volumes e receita maiores são positivos. Investimento não gera alerta direcional.</p><div class="actions"><button class="primary">Salvar</button><button type="button" onclick="this.closest('dialog').close()">Cancelar</button></div></form></dialog><dialog id="valuesDialog"><form onsubmit="saveValues(event)"><h2>Atualizar indicadores</h2><label>Período comparado</label><input name="period" placeholder="Ex.: 01–15 nov vs 01–15 out" required>${c.kpis.map((k,i)=>`<div class="metricform"><b>${k}</b><div><label>Anterior</label><input type="number" step="any" min="0" name="p${i}" value="${c.values[k]?.previous??''}" required></div><div><label>Atual</label><input type="number" step="any" min="0" name="v${i}" value="${c.values[k]?.current??''}" required></div></div>`).join('')}<p class="muted small">Base anterior zero não gera variação percentual.</p><div class="actions"><button class="primary">Salvar e avaliar</button><button type="button" onclick="this.closest('dialog').close()">Cancelar</button></div></form></dialog>`}
function saveKpis(e){e.preventDefault();let f=new FormData(e.target),c=C();c.kpis=f.getAll('kpi');c.threshold=Number(f.get('threshold'));evaluate(c);save();render()}
function saveValues(e){e.preventDefault();let f=data(e.target),c=C();c.kpis.forEach((k,i)=>c.values[k]={previous:Number(f['p'+i]),current:Number(f['v'+i]),period:f.period});evaluate(c);save();render()}
function alertRow(c,a){return `<div class="alertrow"><span class="status ${a.positive?'good':'bad'}">${a.positive?'Melhora':'Piora'}</span> <b>${esc(a.detail)}</b><p class="small muted">${esc(c.name)} · Destinatário: ${esc(c.account||a.owner)} · ${esc(a.status)}</p>${a.note?`<p>${esc(a.note)}</p>`:''}<div class="actions"><button class="mini" onclick="handleAlert('${c.id}','${a.id}')">Registrar tratativa</button><button class="mini" onclick="draftAlert('${c.id}','${a.id}')">Preparar comunicação</button><button class="mini" onclick="resolveAlert('${c.id}','${a.id}')">Resolver</button></div></div>`}
function alertCenter(){return head('Central de alertas','Fila interna de notificações por responsável. Nenhum envio externo automático neste beta.')+`<div class="card">${db.clients.map(c=>openAlerts(c).map(a=>alertRow(c,a)).join('')).join('')||'Nenhum alerta pendente.'}</div>`}
function getAlert(cid,id){let c=db.clients.find(x=>x.id===cid);return [c,c.alerts.find(a=>a.id===id)]}
function handleAlert(cid,id){let [c,a]=getAlert(cid,id),n=prompt('Registre ação, responsável e próximos passos:',a.note);if(n!==null){a.note=n;a.status='Em tratativa';save();render()}}
function resolveAlert(cid,id){let [c,a]=getAlert(cid,id);a.status='Resolvido';save();render()}
function draftAlert(cid,id){let [c,a]=getAlert(cid,id);copy(`Olá! Identificamos uma ${a.positive?'melhora':'piora'} nos indicadores de ${c.name}: ${a.detail}. Vamos validar o contexto e as possíveis causas. ${a.positive?'Podemos avaliar como preservar o avanço.':'Vamos estruturar um plano de melhoria e acompanhar os próximos resultados.'} ${a.note||''}`)}
function brandedReport(){let c=C(),logo='';try{let u=new URL(c.logo);if(u.protocol==='https:')logo=`<img src="${esc(u.href)}" style="max-width:180px;max-height:80px">`}catch{}let html=`<!doctype html><meta charset="utf-8"><title>Relatório ${esc(c.name)}</title><style>body{font:16px system-ui;max-width:850px;margin:60px auto;color:#222}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #ddd;padding:14px}h1{font-size:34px}</style>${logo}<h1>Relatório de performance</h1><h2>${esc(c.name)}</h2><p>Responsável: ${esc(c.account||'—')} · Dados manuais / demonstração</p><table><tr><th>Indicador</th><th>Anterior</th><th>Atual</th><th>Variação</th></tr>${c.kpis.map(k=>`<tr><td>${k}</td><td>${fmt(c.values[k]?.previous,k)}</td><td>${fmt(c.values[k]?.current,k)}</td><td>${change(c.values[k])===null?'—':change(c.values[k]).toFixed(1)+'%'}</td></tr>`).join('')}</table><h2>Alertas em acompanhamento</h2>${openAlerts(c).map(a=>`<p>${esc(a.detail)} — ${esc(a.note||'Aguardando análise')}</p>`).join('')}<p>Inteira · Relatório padronizado. Não representa dados sincronizados com APIs.</p>`;let url=URL.createObjectURL(new Blob([html],{type:'text/html'}));let a=document.createElement('a');a.href=url;a.download='relatorio-'+c.name.replace(/[^a-z0-9]/gi,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}


function reportCenter(c){init(c);c.savedReports??=[];return head('Relatórios','Central de relatórios padronizados · '+esc(c.name))+`<div class="grid"><form class="card" onsubmit="createClientReport(event)"><h2>Novo relatório</h2><label>Modelo</label><select name="type"><option>Performance consolidada</option><option>Meta Ads / Social Media</option><option>Google Ads</option><option>CRM / Comercial</option><option>Executivo mensal</option></select><div class="grid">${dateFields41(ranges41(getDates41(c)),'r')}</div><label>Indicadores disponíveis</label>${Object.keys(catalog).map(k=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input style="width:auto" type="checkbox" name="metric" value="${esc(k)}" ${c.kpis.includes(k)?'checked':''}>${esc(k)} · ${esc(catalog[k][0])}</label>`).join('')}${text('summary','Resumo executivo / análise (opcional)')}${text('next','Recomendações e próximos passos (opcional)')}<label style="display:flex;gap:8px"><input type="checkbox" name="alerts" disabled style="width:auto">Alertas por período (em breve)</label><button class="primary" style="margin-top:15px">Gerar relatório e visualizar</button></form><div class="card"><h2>Identidade e fonte</h2><p><b>${esc(c.name)}</b></p><p>Responsável: ${esc(c.account||'Não atribuído')}</p><p>${c.logo?'Logo cadastrado (URL)':'Logo não cadastrado'}</p><button onclick="go('Clientes & marca')">Editar identidade</button><p class="notice">Os relatórios usam os números manuais já cadastrados. O período informado é um rótulo; não consulta APIs nem filtra histórico automaticamente. Indicadores sem dados ficam em branco. A análise por IA é preparada como prompt.</p><button onclick="go('Visão geral')">Atualizar indicadores da conta</button></div></div><div id="reportPreview"></div><div class="card section"><h2>Histórico de relatórios</h2>${c.savedReports.map(r=>`<div class="alertrow"><b>${esc(r.type)} · ${esc(r.period)}</b><p class="small muted">${esc(r.created)}</p><div class="actions"><button onclick="previewReport('${r.id}')">Visualizar</button><button onclick="downloadReport('${r.id}')">Baixar HTML</button><button onclick="copyReportAI('${r.id}')">Copiar solicitação de análise IA</button></div></div>`).join('')||'<p class="muted">Nenhum relatório gerado.</p>'}</div>`}
function createClientReport(e){e.preventDefault();let c=C(),f=new FormData(e.target),d=Object.fromEntries(f),ks=f.getAll('metric');if(!d.period.trim()||!ks.length)return alert('Informe o período e selecione indicadores.');let r={id:uid(),type:d.type,period:d.period,comparison:d.comparison,summary:d.summary,next:d.next,created:new Date().toLocaleString('pt-BR'),client:c.name,account:c.account,logo:c.logo,metrics:ks.map(k=>({k,source:catalog[k][0],v:c.values[k]?{...c.values[k]}:null})),alerts:f.has('alerts')?openAlerts(c).map(a=>({...a})):[]};c.savedReports??=[];c.savedReports.unshift(r);save();render();previewReport(r.id)}
function findReport(id){return C().savedReports.find(r=>r.id===id)}
function reportBody(r){let logo='';try{let u=new URL(r.logo);if(u.protocol==='https:')logo=`<img src="${esc(u.href)}" alt="Logo do cliente" style="max-width:160px;max-height:70px;object-fit:contain">`}catch{}return `${logo}<div class="tag">INTEIRA / RELATÓRIO</div><h1>${esc(r.type)}</h1><h2>${esc(r.client)}</h2><p>Período: ${esc(r.period)} · Comparação: ${esc(r.comparison||'Não informada')}</p><p>Responsável: ${esc(r.account||'—')}</p><h2>Indicadores</h2><table><thead><tr><th>Indicador / fonte prevista</th><th>Anterior</th><th>Atual</th><th>Variação</th></tr></thead><tbody>${r.metrics.map(m=>{let d=change(m.v);return `<tr><td>${esc(m.k)}<br><small>${esc(m.source)} · ${esc(m.v?.period||'Sem período de origem')}</small></td><td>${fmt(m.v?.previous,m.k)}</td><td>${fmt(m.v?.current,m.k)}</td><td>${d===null?'—':d.toFixed(1)+'%'}</td></tr>`}).join('')}</tbody></table><h2 style="margin-top:24px">Resumo executivo</h2><p style="white-space:pre-wrap">${esc(r.summary||'Análise não preenchida.')}</p><h2>Próximos passos</h2><p style="white-space:pre-wrap">${esc(r.next||'A definir.')}</p>${r.alerts.length?`<h2>Alertas e tratativas</h2>${r.alerts.map(a=>`<p>${esc(a.detail)} — ${esc(a.note||'Aguardando análise')}</p>`).join('')}`:''}<p class="muted small">Dados manuais / demonstração. Sem sincronização com plataformas. Gerado em ${esc(r.created)}.</p>`}
function reportDocument(r){return `<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>${esc(r.type)} | ${esc(r.client)}</title><style>body{font:15px system-ui;color:#20251e;max-width:900px;margin:40px auto;padding:20px}h1{font-size:32px}h2{margin-top:24px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}.tag,.muted,small{color:#70786c} @media print{button{display:none}body{margin:0;padding:0}}</style><button onclick="window.print()">Imprimir / salvar PDF</button>${reportBody(r)}</html>`}
function previewReport(id){let r=findReport(id),el=document.getElementById('reportPreview');el.innerHTML=`<div class="reportpreview"><div class="actions no-print"><button class="primary" onclick="downloadReport('${id}')">Baixar HTML</button><button onclick="printReport('${id}')">Imprimir / salvar PDF</button><button onclick="copyReportAI('${id}')">Preparar análise IA</button></div><hr>${reportBody(r)}</div>`;el.scrollIntoView({behavior:'smooth'})}
function downloadReport(id){let r=findReport(id),url=URL.createObjectURL(new Blob([reportDocument(r)],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='relatorio-'+r.client.replace(/[^a-z0-9]/gi,'-')+'-'+r.id+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printReport(id){let w=window.open('','_blank');if(!w)return alert('Permita pop-ups ou baixe o HTML e use Imprimir.');w.document.write(reportDocument(findReport(id)));w.document.close()}
function copyReportAI(id){copy(context()+'Analise este relatório, separe fatos de hipóteses, destaque evolução e piora, proponha ações com responsáveis. Não invente dados.\n'+JSON.stringify(findReport(id),null,2))}

function hero4(c){return `<div class="account-head">${logo4(c)}<div><div class="tag">AMBIENTE DO CLIENTE</div><h2>${esc(c.name)}</h2><p>${esc(c.segment)} · ${esc(c.account||'Gestor não atribuído')}</p></div><button onclick="go('Clientes & marca')">Editar marca e Drive</button></div>`;}
function funnel4(c,editable=false){v4(c);let f=c.funnel;const max=Math.max(1,...f.map(x=>x.count));return `<div class="card section"><div class="row"><div><div class="tag">Conversão comercial · ${esc(c.funnelPeriod||'Período não informado')}</div><h2>Funil de vendas</h2></div>${editable?'':'<button onclick="go(\'Funil\')">Personalizar funil</button>'}</div>${f.length?f.map((x,i)=>{let prev=i?f[i-1].count:null,rate=prev>0?(x.count/prev*100).toFixed(1)+'%':'—';return `<div class="funnel-line"><div><b>${esc(x.name)}</b><small>${esc(x.source||'Manual')}</small></div><div class="funnel-track"><span style="width:${100*x.count/max}%"></span></div><strong>${x.count.toLocaleString('pt-BR')}</strong><small>${i?'Conversão: '+rate:'Entrada'}</small></div>`}).join(''):'<p class="muted">Cadastre as etapas e os volumes do funil deste cliente.</p>'}${f.length>1&&f[0].count>0?`<p class="notice">Conversão total: <b>${(f.at(-1).count/f[0].count*100).toFixed(1)}%</b> · volumes manuais, valide que correspondem à mesma coorte e período.</p>`:''}</div>`;}
function editFunnel(){let c=v4();return head('Funil comercial','Personalize etapas, origem e volume por período.')+funnel4(c,true)+`<form class="card section" onsubmit="saveFunnel4(event)"><h2>Configuração</h2>${field('period','Período',c.funnelPeriod)}<div id="funnelRows">${(c.funnel.length?c.funnel:[{name:'Leads',count:100},{name:'Qualificados',count:50},{name:'Reuniões',count:20},{name:'Propostas',count:10},{name:'Vendas',count:3}]).map(funnelRow4).join('')}</div><p class="muted small">Os valores iniciais são exemplo; altere antes de salvar.</p><div class="actions"><button type="button" onclick="document.getElementById('funnelRows').insertAdjacentHTML('beforeend',funnelRow4({}))">+ Etapa</button><button class="primary">Salvar funil</button></div></form>`;}
function funnelRow4(x){return `<div class="funnel-edit"><input name="stage" placeholder="Etapa" required value="${esc(x.name)}"><input name="count" type="number" min="0" step="1" required value="${x.count??''}"><input name="source" placeholder="Fonte (CRM, Meta...)" value="${esc(x.source)}"><button type="button" onclick="this.parentElement.remove()">Remover</button></div>`;}
function saveFunnel4(e){e.preventDefault();let f=new FormData(e.target),names=f.getAll('stage'),counts=f.getAll('count'),sources=f.getAll('source');C().funnel=names.map((name,i)=>({name,count:Number(counts[i]),source:sources[i]}));C().funnelPeriod=f.get('period');save();render();}
function job4(kind,mode,input){let c=v4(),j={id:uid(),kind,mode,input,created:new Date().toISOString(),status:'Rascunho',output:'',source:'',provider:db.provider4||'OpenAI'};c.jobs.unshift(j);save();render();return j;}
function requestText4(j){let c=C();return `Tarefa: ${j.kind} / ${j.mode}\nCliente: ${c.name}\nPasta autorizada do cliente: ${c.drive||'NÃO VINCULADA'}\nPasta institucional autorizada: ${db.institutionDrive4||'NÃO VINCULADA'}\nSolicitação (não é evidência factual): ${JSON.stringify(j.input,null,2)}\nUse somente documentos efetivamente recuperados dessas pastas autorizadas. Não use pesquisa externa, memória de outros clientes ou fatos sem evidência. Informe documentos, versões e lacunas. Não afirme ter lido arquivos sem acesso. Se faltarem fontes, interrompa e solicite acesso. Para artes, use referências e logo original do cliente; para cronograma, retorne datas, pilares, canal, formato, tema, legenda, CTA e briefing visual.`;}
function jobList4(kind){let c=v4();return `<div class="section"><h2>Histórico e aprovação</h2>${c.jobs.filter(j=>j.kind===kind).map(j=>`<div class="card job"><div class="row"><div><b>${esc(j.mode)}</b><p class="small muted">${esc(j.created.slice(0,10))} · ${esc(j.provider)} · ${esc(j.status)}</p></div><span class="status ${j.status==='Aprovado'?'good':'neutral'}">${esc(j.status)}</span></div><details><summary>Solicitação e resultado</summary><pre>${esc(JSON.stringify(j.input,null,2))}</pre><label>Resultado produzido (cole aqui após geração externa)</label><textarea id="out-${j.id}">${esc(j.output)}</textarea><label>Fontes verificadas / links dos arquivos</label><input id="src-${j.id}" value="${esc(j.source)}"><div class="actions"><button onclick="storeJob4('${j.id}')">Salvar revisão</button><button onclick="copy(requestText4(v4().jobs.find(x=>x.id==='${j.id}')))">Copiar solicitação IA</button><button onclick="approve4('${j.id}')" class="primary">Aprovar</button>${j.kind==='Planejamento'?`<button onclick="exportJob4('${j.id}','pdf')">PDF</button><button onclick="exportJob4('${j.id}','pptx')">PPTX</button>`:''}</div><p class="small muted">Drive: ${j.status==='Aprovado'?'Aprovado no sistema; sincronização pendente':'Aguardando aprovação'}</p></details></div>`).join('')||'<p class="muted">Nenhuma solicitação registrada.</p>'}</div>`;}
function storeJob4(id){let j=v4().jobs.find(x=>x.id===id);j.output=document.getElementById('out-'+id).value;j.source=document.getElementById('src-'+id).value;j.status='Em revisão';save();render();}
function approve4(id){let j=v4().jobs.find(x=>x.id===id);let o=document.getElementById('out-'+id).value.trim(),s=document.getElementById('src-'+id).value.trim();if(!o||!s)return alert('Informe o resultado e as fontes verificadas antes de aprovar.');j.output=o;j.source=s;j.status='Aprovado';save();render();}
function plan4(c){return head('Planejamento estratégico','Briefing, inteligência contextual e aprovação.')+`<div class="grid"><form class="card" onsubmit="event.preventDefault();job4('Planejamento',this.mode.value,data(this))"><h2>Novo planejamento</h2><label>Modo</label><select name="mode">${opts(['Criar novo planejamento','Sugerir novo planejamento','Otimizar planejamento existente','Gerar a partir de transcrição'])}</select><div class="grid">${field('period','Período','')}${field('objective','Objetivo',c.goal)}${field('audience','Público-alvo')}${field('budget','Orçamento')}${field('channels','Canais')}${field('goal','Meta')}</div>${text('brief','Momento da marca, diferenciais, dores e concorrentes',c.brief)}${text('transcript','Transcrição ou link de documento / planejamento anterior')}${text('constraints','Restrições e observações')}<button class="primary">Preparar geração com IA</button><p class="small muted">A geração real depende do backend e leitura autorizada do Drive.</p></form><div class="card"><h2>Fluxos de planejamento</h2>${['Criar novo planejamento','Sugerir novo planejamento','Otimizar planejamento existente','Gerar a partir de transcrição'].map((s,i)=>`<button class="workflow" onclick="document.querySelector('select[name=mode]').selectedIndex=${i};document.querySelector('select[name=mode]').scrollIntoView({behavior:'smooth'})">${s} →</button>`).join('')}<p class="notice">Saída: diagnóstico, posicionamento, objetivos, pilares, campanhas e plano de ação. Aprovação obrigatória antes de sincronizar.</p></div></div>`+jobList4('Planejamento')+history(c.plans,'Histórico da V3');}
function calendar4(c){return head('Social Media','Cronograma por planejamento, com pilares e produção integrada.')+`<div class="grid"><form class="card" onsubmit="event.preventDefault();job4('Cronograma',this.mode.value,data(this))"><h2>Gerar cronograma</h2><label>Origem</label><select name="mode">${opts(['Geração automática com base no Drive','A partir de planejamento de posicionamento e conteúdo'])}</select><label>Planejamento aprovado local</label><select name="plan"><option value="">Selecionar / utilizar arquivo no Drive</option>${v4(c).jobs.filter(j=>j.kind==='Planejamento'&&j.status==='Aprovado').map(j=>`<option value="${j.id}">${esc(j.mode+' · '+(j.input.period||j.created.slice(0,10)))}</option>`).join('')}</select>${field('drivePlan','Link do planejamento no Drive')}${field('period','Mês / período',c.calendarPeriod)}${field('volume','Quantidade de posts')}${text('notes','Campanhas, canais e observações')}<button class="primary">Preparar geração automática</button></form><form class="card" onsubmit="savePost4(event)"><h2>Adicionar ou importar pauta manual</h2><div class="grid"><div><label>Data</label><input type="date" name="date" required></div>${field('channel','Canal','Instagram')}${field('format','Formato','Feed')}${field('pillar','Pilar')}${field('title','Tema / headline')}${field('cta','CTA')}</div>${text('caption','Legenda')}${text('visual','Briefing visual / referência')}<button class="primary">Adicionar pauta</button></form></div><div class="card section"><form onsubmit="event.preventDefault();Object.assign(C(),data(this));C().calendarApproved=false;save();render()"><div class="grid">${field('calendarPeriod','Mês do cronograma',c.calendarPeriod)}${text('pillars','Pilares do mês',c.pillars)}</div><button>Salvar pilares e período</button></form><div class="row section"><h2>Calendário editorial</h2><div class="actions"><button onclick="approveCalendar4()" class="primary">${c.calendarApproved?'Revalidar':'Aprovar cronograma'}</button><button onclick="exportCalendar4('pdf')">PDF</button><button onclick="exportCalendar4('xlsx')">XLSX</button></div></div><p class="small muted">${c.calendarApproved?'Aprovado no sistema · Drive pendente':'Em elaboração'}</p><div class="portfolio-table"><table><tr><th>Data</th><th>Canal / formato</th><th>Pilar / tema</th><th>Legenda</th><th>Ações</th></tr>${c.posts.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.channel)} · ${esc(p.format)}</td><td>${esc(p.pillar)}<br><b>${esc(p.title)}</b></td><td>${esc(p.caption)}</td><td><button onclick="postTask('${p.id}')">Tarefa</button> <button onclick="deletePost4('${p.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`+jobList4('Cronograma');}
function savePost4(e){e.preventDefault();let d=data(e.target);if(!d.title.trim())return alert('Informe tema.');C().posts.push({...d,id:uid()});C().calendarApproved=false;save();render();}
function deletePost4(id){if(confirm('Excluir pauta?')){C().posts=C().posts.filter(p=>p.id!==id);C().calendarApproved=false;save();render();}}
function approveCalendar4(){if(!C().posts.length)return alert('Cadastre pautas antes de aprovar.');C().calendarApproved=true;save();render();}
function creative4(c){return head('Artes e produção','Transforme pautas em solicitações criativas e aprove peças.')+`<div class="grid"><div class="card"><h2>Gerar artes a partir de cronograma de posts</h2><p>${c.posts.length} pautas · ${c.calendarApproved?'Cronograma aprovado':'Cronograma em revisão'}</p><button class="primary" onclick="batchArt4()">Gerar solicitações de artes</button><p class="small muted">Cria uma solicitação por pauta, sem gerar imagens fictícias.</p></div><form class="card" onsubmit="event.preventDefault();job4('Arte','Sugerir arte',data(this))"><h2>Sugerir arte</h2>${text('objective','Objetivo ou orientação opcional')}${field('format','Formato','1080 × 1350')}<button class="primary">Sugerir arte com IA</button></form></div><div class="section"><h2>Produção e aprovação visual</h2><div class="grid">${v4(c).jobs.filter(j=>j.kind==='Arte').map(j=>`<div class="card"><div class="art-preview">${image4(j.image)?`<img src="${esc(j.image)}" alt="Arte">`:'<span>Prévia da peça após anexar</span>'}</div><h3>${esc(j.input.title||j.mode)}</h3><p class="small muted">${esc(j.input.date||'Sem data')} · ${esc(j.status)}</p><p>${esc(j.input.caption||'')}</p><label>Arquivo de imagem (PNG/JPG/WebP)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="attachArt4('${j.id}',this.files[0])"><label>Fontes utilizadas</label><input id="artsrc-${j.id}" value="${esc(j.source)}"><div class="actions section"><button onclick="copy(requestText4(v4().jobs.find(x=>x.id==='${j.id}')))">Copiar solicitação IA</button><button onclick="approveArt4('${j.id}')" class="primary">Aprovar arte</button><button onclick="reviseArt4('${j.id}')">Revisar</button></div><p class="small muted">${j.status==='Aprovado'?'Aprovado no sistema · Drive pendente':'Aguardando aprovação'}</p></div>`).join('')||'<p class="muted">Nenhuma peça na fila.</p>'}</div></div>`+history(c.creative,'Briefings da V3');}
function image4(s){return typeof s==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(s);}
function batchArt4(){let c=v4();if(!c.calendarApproved)return alert('Aprove o cronograma primeiro.');let n=0;c.posts.forEach(p=>{if(c.jobs.some(j=>j.kind==='Arte'&&j.input.postId===p.id))return;c.jobs.unshift({id:uid(),kind:'Arte',mode:'Arte do cronograma',input:{...p,postId:p.id},status:'Rascunho',created:new Date().toISOString(),provider:'OpenAI',source:'',output:''});n++;});save();render();alert(n+' solicitações criadas. Geração de imagens depende da API.');}
function attachArt4(id,file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1200000)return alert('Use imagem PNG/JPG/WebP de até 1,2 MB no beta local.');let r=new FileReader();r.onload=()=>{let j=v4().jobs.find(x=>x.id===id);j.image=r.result;j.status='Em revisão';save();render()};r.readAsDataURL(file);}
function approveArt4(id){let j=v4().jobs.find(x=>x.id===id),s=document.getElementById('artsrc-'+id).value.trim();if(!image4(j.image)||!s)return alert('Anexe a imagem e informe as fontes verificadas.');j.source=s;j.status='Aprovado';save();render();}
function reviseArt4(id){let j=v4().jobs.find(x=>x.id===id);j.status='Em revisão';save();render();}
function delivery4(c){let plans=v4(c).jobs.filter(j=>j.kind==='Planejamento'&&j.status==='Aprovado'),approved=c.jobs.filter(j=>j.kind==='Arte'&&j.status==='Aprovado'&&c.posts.some(p=>p.id===j.input.postId)),ready=plans.length&&c.calendarApproved&&c.posts.length&&c.posts.every(p=>approved.some(j=>j.input.postId===p.id));return head('Entrega mensal','Pacote de apresentação ao cliente, com uma arte por slide.')+`<div class="cards">${[['Planejamento',plans.length?'Aprovado':'Pendente'],['Cronograma',c.calendarApproved?'Aprovado':'Pendente'],['Artes',approved.length+' / '+c.posts.length]].map(x=>`<div class="card"><div class="tag">${x[0]}</div><h2>${x[1]}</h2></div>`).join('')}</div><div class="card"><h2>Apresentação consolidada</h2><p>Resumo estratégico → pilares do mês → sequência de peças com data e legenda ao lado.</p><label>Planejamento aprovado</label><select id="deliveryPlan">${plans.map(j=>`<option value="${j.id}">${esc(j.input.period||j.mode)}</option>`).join('')}</select><div class="actions section"><button ${ready?'':'disabled'} class="primary" onclick="exportDelivery4('pptx')">Baixar PPTX</button><button ${ready?'':'disabled'} onclick="exportDelivery4('pdf')">Imprimir / salvar PDF</button></div>${ready?'':'<p class="notice">Conclua e aprove todas as etapas antes de liberar a apresentação.</p>'}</div>`;}
function portal4(c){v4(c);let day=new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),used=c.portalRequests.filter(j=>j.day===day).length;return head('Portal do cliente','Prévia interna do acesso externo · portal externo ainda indisponível.')+`<div class="card"><div class="row"><div>${logo4(c)}<h2>Olá, ${esc(c.name)}</h2><p>Seus resultados e materiais aprovados.</p></div><div><div class="tag">Solicitações de arte hoje</div><div class="metric">${used} / ${c.portalLimit}</div><div class="bar"><i style="width:${Math.min(100,used/c.portalLimit*100)}%"></i></div></div></div></div>`+funnel4(c,true)+`<div class="cards">${c.kpis.map(k=>`<div class="card"><div class="tag">${esc(k)}</div><div class="metric">${fmt(c.values[k]?.current,k)}</div></div>`).join('')}</div><div class="grid"><form class="card" onsubmit="portalRequest4(event)"><h2>Solicitar nova arte</h2>${text('objective','O que deseja criar?')}${field('format','Formato','Feed')}<button class="primary" ${used>=c.portalLimit?'disabled':''}>Solicitar arte</button><p class="small muted">Limite ilustrativo; geração externa indisponível nesta versão.</p><button type="button" onclick="upgrade4()">Solicitar upgrade (sem cobrança)</button></form><div class="card"><h2>Materiais aprovados</h2>${c.jobs.filter(j=>j.status==='Aprovado').map(j=>`<p>${esc(j.kind)} · ${esc(j.input.title||j.mode)} ${image4(j.image)?`<a download="arte.png" href="${j.image}">Baixar arte</a>`:''}</p>`).join('')||'<p>Nenhum material aprovado.</p>'}<h3>Relatórios aprovados</h3>${(c.savedReports||[]).filter(r=>r.approved).map(r=>`<p>${esc(r.type)} · ${esc(r.period)} <button onclick="printReport('${r.id}')">PDF</button></p>`).join('')||'<p>Nenhum relatório aprovado.</p>'}</div></div>`;}
function portalRequest4(e){e.preventDefault();let c=v4(),day=new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),d=data(e.target);if(!d.objective.trim())return alert('Descreva a solicitação.');if(c.portalRequests.filter(j=>j.day===day).length>=c.portalLimit)return alert('Limite diário atingido.');c.portalRequests.push({day,id:uid()});job4('Arte','Solicitação do portal',d);}
function upgrade4(){C().upgradeRequested=true;save();alert('Interesse registrado. Nenhuma cobrança realizada.');}
function governance4(){return head('Governança de IA','Conhecimento institucional e por cliente, com provedores intercambiáveis.')+`<form class="card" onsubmit="event.preventDefault();let d=data(this);db.provider4=d.provider;db.institutionDrive4=d.institution;save();render()"><h2>Provedores</h2><div class="grid"><div class="notice"><b>OpenAI</b><p>Texto e imagens · API não conectada</p></div><div class="notice"><b>Claude</b><p>Texto e análise · API não conectada</p></div></div><label>Motor preferencial de texto</label><select name="provider">${['OpenAI','Claude'].map(x=>`<option ${db.provider4===x?'selected':''}>${x}</option>`).join('')}</select>${field('institution','Pasta institucional do Google Drive',db.institutionDrive4)}<p class="notice">Modo estrito obrigatório · somente fontes recuperadas das pastas autorizadas · sem pesquisa externa · citações e aprovação humana. No beta, o sistema apenas prepara solicitações; não recupera arquivos.</p><button class="primary">Salvar preferências</button></form><div class="card section"><h2>Integrações diretas</h2>${['Google Drive','Meta Marketing API','Google Ads API','GA4','CRM','Supabase'].map(x=>`<p>${x} <span class="status neutral">Não conectado neste HTML</span></p>`).join('')}</div>`;}
function report4(c){return oldReportCenter(c)+funnel4(c)+`<div class="card section"><h2>Entrega e aprovação de relatórios</h2>${(c.savedReports||[]).map(r=>`<div class="row alertrow"><div><b>${esc(r.type)} · ${esc(r.period)}</b><p class="small muted">${r.approved?'Aprovado no sistema · Drive pendente':'Em revisão'}</p></div><div class="actions"><button onclick="approveReport4('${r.id}')">Aprovar</button><button onclick="exportReport4('${r.id}')">PPTX</button><button onclick="printReport('${r.id}')">PDF</button></div></div>`).join('')||'<p>Nenhum relatório.</p>'}</div>`;}
function approveReport4(id){findReport(id).approved=true;save();render();}
createClientReport=function(e){oldCreateReport(e);let r=C().savedReports?.[0];if(r){r.funnel=structuredClone(v4().funnel);r.funnelPeriod=C().funnelPeriod;save();render();previewReport(r.id)}};
reportBody=function(r){return `<img src="${BRAND}" alt="Inteira" style="width:140px;display:block;margin-bottom:20px">`+oldReportBody(r)+(r.funnel?.length?funnel4({funnel:r.funnel,funnelPeriod:r.funnelPeriod},true):'');};
function download4(name,blob){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function print4(title,sections){let w=window.open('','_blank');if(!w)return alert('Permita pop-ups para imprimir.');w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:16px system-ui;color:#14283c;margin:24px}section{break-after:page;min-height:75vh;padding:24px}section:last-child{break-after:auto}h1{font-size:32px}pre{white-space:pre-wrap;font:inherit}img{max-width:100%;max-height:570px;object-fit:contain}.slide-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media print{button{display:none}body{margin:0}}</style><button onclick="window.print()">Imprimir / salvar PDF</button>${sections.map(s=>`<section><div style="display:flex;justify-content:space-between;align-items:center"><img src="${BRAND}" style="width:135px">${logo4(C())}</div><h1>${esc(s.title)}</h1>${s.html}</section>`).join('')}</html>`);w.document.close();}
